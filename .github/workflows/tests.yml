name: tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require published application and test sources
        run: |
          test -f app.py
          test -f indexed.py
          test -f test_app.py
      - name: Run unit tests
        run: python -m unittest discover -q
